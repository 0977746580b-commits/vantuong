<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Rich metallic gradient matching ref_4.webp Điềm Ngữ gold stippling -->
    <linearGradient id="goldRoyalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="18%" stop-color="#F5D77F" />
      <stop offset="38%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#8E5B10" />
      <stop offset="82%" stop-color="#FCE699" />
      <stop offset="100%" stop-color="#A57016" />
    </linearGradient>

    <!-- Deep 3D gold shadow & glowing bevel -->
    <filter id="goldEmbossHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FFF2BD" flood-opacity="0.7" />
    </filter>
  </defs>

  <style>
    .ornate-title-back {
      font-family: 'Cinzel Decorative', 'Cinzel', 'Playfair Display', Georgia, serif;
      font-weight: 900;
      letter-spacing: 0.18em;
      fill: #2A0905;
      stroke: #120402;
      stroke-width: 8px;
    }
    .ornate-title-gold {
      font-family: 'Cinzel Decorative', 'Cinzel', 'Playfair Display', Georgia, serif;
      font-weight: 900;
      letter-spacing: 0.18em;
      fill: url(#goldRoyalGrad);
      stroke: #FFEFA3;
      stroke-width: 1.6px;
      filter: url(#goldEmbossHeavy);
    }
    .swash-accent {
      fill: none;
      stroke: url(#goldRoyalGrad);
      stroke-width: 2.4;
      stroke-linecap: round;
    }
  </style>

  <!-- Decorative Imperial Diamond Star -->
  <g transform="translate(550, 26) scale(0.9)">
    <path d="M 0 -20 L 5 -5 L 20 0 L 5 5 L 0 20 L -5 5 L -20 0 L -5 -5 Z" fill="url(#goldRoyalGrad)" filter="url(#goldEmbossHeavy)" />
    <circle cx="0" cy="0" r="3" fill="#FFFDF5" />
    <line x1="-120" y1="0" x2="-32" y2="0" stroke="url(#goldRoyalGrad)" stroke-width="1.4" opacity="0.85" />
    <line x1="32" y1="0" x2="120" y2="0" stroke="url(#goldRoyalGrad)" stroke-width="1.4" opacity="0.85" />
    <circle cx="-120" cy="0" r="2.5" fill="url(#goldRoyalGrad)" />
    <circle cx="120" cy="0" r="2.5" fill="url(#goldRoyalGrad)" />
  </g>

  <!-- Main Grand Title: VẠN TƯỢNG (Layered for depth & sharp readability) -->
  <text x="550" y="148" text-anchor="middle" font-size="98" class="ornate-title-back">VẠN TƯỢNG</text>
  <text x="550" y="148" text-anchor="middle" font-size="98" class="ornate-title-gold">VẠN TƯỢNG</text>

  <!-- Calligraphic Underline Flourish with Lotus Motif -->
  <path d="M 160 182 Q 340 190 550 178 Q 760 190 940 182 Q 780 200 550 190 Q 320 200 160 182 Z" fill="url(#goldRoyalGrad)" opacity="0.95" filter="url(#goldEmbossHeavy)" />
  <!-- Center lotus jewel on underline -->
  <circle cx="550" cy="184" r="5" fill="#7A1E18" stroke="#FFEBA8" stroke-width="1.8" />
  <circle cx="550" cy="184" r="2" fill="#FFFDF5" />
  <circle cx="500" cy="184" r="2.5" fill="url(#goldRoyalGrad)" />
  <circle cx="600" cy="184" r="2.5" fill="url(#goldRoyalGrad)" />
</svg>
