<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGradWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#F7EBD2" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#EEDAC0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cloudGoldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6A052" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#FCD55C" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#C6A052" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#88301B" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="cloudSoftGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Flowing Auspicious Cloud Ribbon -->
  <g filter="url(#cloudSoftGlow)">
    <path d="M 0 180
             C 120 170, 180 110, 240 120
             C 280 125, 300 80, 360 85
             C 420 90, 450 140, 520 130
             C 580 120, 610 60, 690 70
             C 770 80, 800 150, 890 140
             C 960 130, 1020 90, 1100 110
             C 1150 120, 1180 150, 1200 160
             L 1200 240
             C 1140 220, 1080 250, 1010 230
             C 930 210, 880 260, 800 250
             C 710 240, 680 190, 590 200
             C 510 210, 480 260, 400 240
             C 320 220, 260 250, 180 230
             C 100 210, 50 250, 0 240 Z"
          fill="url(#cloudGradWhite)" stroke="url(#cloudGoldLine)" stroke-width="2.5"/>

    <!-- Inner Cloud Spirals (Vân Mây Cuộn Thời Lý) -->
    <!-- Spiral 1 -->
    <path d="M 230 140 A 25 25 0 1 0 255 125 A 15 15 0 1 0 242 118"
          fill="none" stroke="url(#cloudGoldLine)" stroke-width="2"/>
    <!-- Spiral 2 -->
    <path d="M 525 155 A 35 35 0 1 0 550 125 A 20 20 0 1 0 535 115 A 10 10 0 1 0 530 122"
          fill="none" stroke="url(#cloudGoldLine)" stroke-width="2.2"/>
    <!-- Spiral 3 -->
    <path d="M 700 95 A 30 30 0 1 0 725 75 A 16 16 0 1 0 712 68"
          fill="none" stroke="url(#cloudGoldLine)" stroke-width="2"/>
    <!-- Spiral 4 -->
    <path d="M 890 160 A 35 35 0 1 0 915 130 A 20 20 0 1 0 900 122"
          fill="none" stroke="url(#cloudGoldLine)" stroke-width="2.2"/>

    <!-- Trailing auspicious vapor curls -->
    <path d="M 120 185 C 160 195, 200 175, 220 185" fill="none" stroke="url(#cloudGoldLine)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M 380 105 C 430 115, 460 95, 490 105" fill="none" stroke="url(#cloudGoldLine)" stroke-width="1.5" stroke-dasharray="5,4"/>
    <path d="M 760 100 C 800 110, 830 90, 860 105" fill="none" stroke="url(#cloudGoldLine)" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
</svg>