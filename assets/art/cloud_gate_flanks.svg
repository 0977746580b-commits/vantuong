<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="100%" height="100%">
  <defs>
    <linearGradient id="roseCloudLeft" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#CC898C" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#A93D2E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#CC898C" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="roseCloudRight" x1="100%" y1="0%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#CC898C" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#A93D2E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#CC898C" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="mountainIvoryGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7EBD2"/>
      <stop offset="50%" stop-color="#E5D1AD"/>
      <stop offset="100%" stop-color="#CC898C"/>
    </linearGradient>
    <linearGradient id="gateGoldOutline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD55C"/>
      <stop offset="50%" stop-color="#C6A052"/>
      <stop offset="100%" stop-color="#88301B"/>
    </linearGradient>
  </defs>

  <!-- Left Flank: Auspicious Rolling Cloud & Mountain Promontory -->
  <g class="flank-left">
    <!-- Back Pale Mountain Layer -->
    <path d="M -50 650 L -50 220
             Q 80 180 180 250
             Q 280 320 380 280
             Q 450 250 520 340
             L 520 650 Z"
          fill="url(#mountainIvoryGold)" stroke="#C6A052" stroke-width="1.8"/>

    <!-- Front Pinkish Auspicious Cloud Masses (Mây Hồng Đất) -->
    <path d="M -50 650 L -50 340
             C 40 310, 80 240, 150 260
             C 210 275, 240 210, 310 225
             C 380 240, 400 320, 480 310
             C 530 305, 570 360, 600 420
             C 620 460, 610 540, 580 650 Z"
          fill="url(#roseCloudLeft)" stroke="url(#gateGoldOutline)" stroke-width="2.5"/>

    <!-- Left Cloud Spirals -->
    <path d="M 160 290 A 28 28 0 1 0 185 260 A 15 15 0 1 0 172 250"
          fill="none" stroke="#FCD55C" stroke-width="2"/>
    <path d="M 320 250 A 30 30 0 1 0 345 220 A 16 16 0 1 0 332 212"
          fill="none" stroke="#FCD55C" stroke-width="2"/>
    <path d="M 480 340 A 32 32 0 1 0 505 310 A 18 18 0 1 0 492 300"
          fill="none" stroke="#FCD55C" stroke-width="2"/>
  </g>

  <!-- Right Flank: Mirror Auspicious Cloud & Mountain Promontory -->
  <g class="flank-right">
    <!-- Back Pale Mountain Layer -->
    <path d="M 1490 650 L 1490 220
             Q 1360 180 1260 250
             Q 1160 320 1060 280
             Q 990 250 920 340
             L 920 650 Z"
          fill="url(#mountainIvoryGold)" stroke="#C6A052" stroke-width="1.8"/>

    <!-- Front Pinkish Auspicious Cloud Masses -->
    <path d="M 1490 650 L 1490 340
             C 1400 310, 1360 240, 1290 260
             C 1230 275, 1200 210, 1130 225
             C 1060 240, 1040 320, 960 310
             C 910 305, 870 360, 840 420
             C 820 460, 830 540, 860 650 Z"
          fill="url(#roseCloudRight)" stroke="url(#gateGoldOutline)" stroke-width="2.5"/>

    <!-- Right Cloud Spirals -->
    <path d="M 1280 290 A 28 28 0 1 1 1255 260 A 15 15 0 1 1 1268 250"
          fill="none" stroke="#FCD55C" stroke-width="2"/>
    <path d="M 1120 250 A 30 30 0 1 1 1095 220 A 16 16 0 1 1 1108 212"
          fill="none" stroke="#FCD55C" stroke-width="2"/>
    <path d="M 960 340 A 32 32 0 1 1 935 310 A 18 18 0 1 1 948 300"
          fill="none" stroke="#FCD55C" stroke-width="2"/>
  </g>
</svg>