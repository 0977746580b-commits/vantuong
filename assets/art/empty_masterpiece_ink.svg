<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <filter id="inkBleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="inkWashGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A110D" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2D1A13" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#4A3024" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1A110D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="inkArtworkGroup" filter="url(#inkBleed)">
    <!-- Soft Ink Wash Atmosphere -->
    <ellipse cx="400" cy="460" rx="320" ry="380" fill="url(#inkWashGrad)"/>
    <ellipse cx="380" cy="360" rx="220" ry="240" fill="url(#inkWashGrad)"/>

    <!-- Sacred Elephant Symbol (Tượng Thần Cổ Tích - Thủy Mặc Loang Lỗ) -->
    <!-- Head & Ears -->
    <path d="M 330 260
             C 310 210, 440 180, 490 240
             C 540 300, 520 380, 460 410
             C 430 425, 390 410, 360 380
             C 320 340, 310 290, 330 260 Z"
          fill="none" stroke="#23140E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

    <!-- Large Majestic Ear Left -->
    <path d="M 340 250 C 260 230, 220 320, 270 410 C 310 470, 370 450, 380 390"
          fill="none" stroke="#1A0D08" stroke-width="12" stroke-linecap="round" opacity="0.65"/>

    <!-- Trunk (Vòi Thần Vươn Cao Uốn Lượn) -->
    <path d="M 430 380
             C 450 460, 430 560, 460 640
             C 480 690, 530 720, 560 690
             C 580 660, 560 610, 520 590
             C 490 570, 480 500, 470 440"
          fill="none" stroke="#160B07" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

    <!-- Tusks (Ngà Voi Thần Dát Ngọc) -->
    <path d="M 410 410 C 440 460, 490 510, 560 520 C 530 490, 480 460, 440 415"
          fill="#3E2419" stroke="#1A0D08" stroke-width="4" opacity="0.5"/>

    <!-- Body & Mountain Mass (Thân Tượng Hóa Núi) -->
    <path d="M 460 380
             C 560 360, 680 430, 710 560
             C 730 650, 700 760, 650 820
             C 610 870, 520 890, 420 880
             C 310 870, 220 810, 170 730
             C 130 660, 140 560, 190 490
             C 230 440, 290 410, 360 400"
          fill="none" stroke="#21120B" stroke-width="18" stroke-linecap="round" opacity="0.7"/>

    <!-- Ancient Seal in Ink (Triện Ấn Mực Nho Thất Truyền) -->
    <rect x="580" y="240" width="80" height="80" fill="none" stroke="#7A2218" stroke-width="4" opacity="0.6"/>
    <text x="620" y="295" font-family="'Playfair Display', serif" font-size="52" fill="#7A2218" font-weight="bold" text-anchor="middle" opacity="0.6">象</text>

    <!-- Traditional Calligraphy Inscription Column (Lạc khoản thư pháp mờ ảo) -->
    <g fill="#2A170F" opacity="0.5" font-family="'Cormorant Garamond', 'Playfair Display', serif">
      <text x="690" y="260" font-size="20" letter-spacing="4">萬</text>
      <text x="690" y="295" font-size="20" letter-spacing="4">象</text>
      <text x="690" y="330" font-size="20" letter-spacing="4">歸</text>
      <text x="690" y="365" font-size="20" letter-spacing="4">一</text>
      <text x="690" y="415" font-size="14" letter-spacing="2">ĐẠI</text>
      <text x="690" y="440" font-size="14" letter-spacing="2">NAM</text>
      <text x="690" y="465" font-size="14" letter-spacing="2">CỔ</text>
      <text x="690" y="490" font-size="14" letter-spacing="2">VẬT</text>
    </g>

    <!-- Ink Splatters & Dots (Vết Mực Tàu Bắn Loang) -->
    <circle cx="310" cy="220" r="4" fill="#1C0E09" opacity="0.7"/>
    <circle cx="490" cy="180" r="3" fill="#1C0E09" opacity="0.6"/>
    <circle cx="580" cy="460" r="5" fill="#1C0E09" opacity="0.8"/>
    <circle cx="210" cy="530" r="6" fill="#1C0E09" opacity="0.7"/>
    <circle cx="430" cy="740" r="4" fill="#1C0E09" opacity="0.6"/>
    <circle cx="540" cy="780" r="7" fill="#1C0E09" opacity="0.75"/>
    <circle cx="620" cy="620" r="5" fill="#1C0E09" opacity="0.6"/>
    <circle cx="350" cy="850" r="8" fill="#1C0E09" opacity="0.7"/>
  </g>
</svg>