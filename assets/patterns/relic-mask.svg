<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <radialGradient id="maskAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5a823" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d9381e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3e1812" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a823"/>
      <stop offset="50%" stop-color="#e06d28"/>
      <stop offset="100%" stop-color="#f5a823"/>
    </linearGradient>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2218"/>
      <stop offset="50%" stop-color="#3e1812"/>
      <stop offset="100%" stop-color="#1f0c08"/>
    </linearGradient>
    <filter id="relicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hào quang nền ấm áp -->
  <circle cx="160" cy="180" r="130" fill="url(#maskAura)"/>

  <!-- Bục đế trưng bày gỗ sơn mài thếp vàng (Pedestal base) -->
  <g id="pedestal">
    <!-- Thớt đá dưới -->
    <path d="M 60,370 L 260,370 L 280,395 L 40,395 Z" fill="url(#woodBase)" stroke="#e06d28" stroke-width="1.5"/>
    <path d="M 40,395 L 280,395 L 280,405 L 40,405 Z" fill="#1f0c08" stroke="#88301b" stroke-width="1"/>
    <!-- Cột trụ giữa -->
    <rect x="130" y="300" width="60" height="70" fill="url(#woodBase)" stroke="#f5a823" stroke-width="1.2"/>
    <line x1="145" y1="300" x2="145" y2="370" stroke="#f5a823" stroke-width="0.8" stroke-opacity="0.5"/>
    <line x1="175" y1="300" x2="175" y2="370" stroke="#f5a823" stroke-width="0.8" stroke-opacity="0.5"/>
    <!-- Bệ đỡ bọc nỉ gấm -->
    <path d="M 100,295 L 220,295 L 210,305 L 110,305 Z" fill="#88301b" stroke="#f5a823" stroke-width="1.5"/>
  </g>

  <!-- Giá đỡ kim loại mạ đồng đỏ nâng mặt nạ -->
  <line x1="160" y1="295" x2="160" y2="230" stroke="#f5a823" stroke-width="4"/>

  <!-- KHỐI MẶT NẠ TUỒNG NGHỆ THUẬT -->
  <g id="tuongMask" filter="url(#relicGlow)">
    <!-- Bóng đổ khối -->
    <ellipse cx="160" cy="175" rx="72" ry="98" fill="#1f0c08" opacity="0.6"/>

    <!-- Khuôn mặt nạ chính (Sơn ta & Trắng ngà) -->
    <path d="M 160,70 C 230,70 245,140 235,210 C 225,260 195,275 160,280 C 125,275 95,260 85,210 C 75,140 90,70 160,70 Z"
          fill="#fbf4e8" stroke="#3e1812" stroke-width="3"/>

    <!-- Hoa văn vẽ mặt Tuồng: Đỏ Chu Sa (DMC 321), Cam Đỏ (DMC 606), Hoàng Kim (DMC 741) -->
    <!-- Mũ miện / Vầng trán ngọn lửa -->
    <path d="M 160,70 Q 180,95 210,90 Q 185,115 195,140 Q 160,110 160,70 Z" fill="#a81c22"/>
    <path d="M 160,70 Q 140,95 110,90 Q 135,115 125,140 Q 160,110 160,70 Z" fill="#a81c22"/>
    <!-- Đỉnh trán lửa tam sơn vàng -->
    <path d="M 160,65 L 170,95 L 160,90 L 150,95 Z" fill="#f5a823" stroke="#e06d28" stroke-width="1"/>

    <!-- Quầng mắt phượng uy dũng -->
    <path d="M 115,145 Q 140,135 155,150 Q 135,160 115,145 Z" fill="#3e1812"/>
    <path d="M 205,145 Q 180,135 165,150 Q 185,160 205,145 Z" fill="#3e1812"/>
    <!-- Mắt mở hé thần thái -->
    <ellipse cx="138" cy="148" rx="8" ry="4" fill="#ffffff"/>
    <ellipse cx="138" cy="148" rx="3.5" ry="3.5" fill="#1f0c08"/>
    <ellipse cx="182" cy="148" rx="8" ry="4" fill="#ffffff"/>
    <ellipse cx="182" cy="148" rx="3.5" ry="3.5" fill="#1f0c08"/>

    <!-- Lông mày kiếm vút ngược lửa chu sa -->
    <path d="M 110,135 Q 135,120 160,132 Q 130,128 105,125 Z" fill="#d9381e"/>
    <path d="M 210,135 Q 185,120 160,132 Q 190,128 215,125 Z" fill="#d9381e"/>

    <!-- Sống mũi cao và chóp mũi dát vàng -->
    <path d="M 160,135 L 164,195 L 160,200 L 156,195 Z" fill="#e06d28"/>
    <polygon points="160,190 168,202 160,206 152,202" fill="#f5a823" stroke="#88301b" stroke-width="0.8"/>

    <!-- Vệt râu mãnh tướng đỏ cam hai bên gò má -->
    <path d="M 95,190 Q 120,200 135,225 Q 115,220 95,190 Z" fill="#a81c22"/>
    <path d="M 225,190 Q 200,200 185,225 Q 205,220 225,190 Z" fill="#a81c22"/>

    <!-- Khuôn miệng tam diện hí kịch -->
    <path d="M 140,235 Q 160,225 180,235 Q 160,250 140,235 Z" fill="#88301b" stroke="#3e1812" stroke-width="1.5"/>
    <path d="M 146,236 Q 160,230 174,236 Q 160,242 146,236 Z" fill="#f5a823"/>

    <!-- Cằm vuông khắc nét sơn mài chu sa -->
    <path d="M 145,260 Q 160,255 175,260 Q 160,272 145,260 Z" fill="#d9381e"/>

    <!-- Hoa tai / Khuyên ngọc tua chỉ vàng buông rủ 2 bên -->
    <g id="tassels">
      <circle cx="85" cy="195" r="5" fill="#f5a823" stroke="#88301b"/>
      <path d="M 85,200 L 80,255 L 90,255 Z" fill="#d9381e"/>
      <line x1="85" y1="200" x2="85" y2="260" stroke="#f5a823" stroke-width="1.2"/>

      <circle cx="235" cy="195" r="5" fill="#f5a823" stroke="#88301b"/>
      <path d="M 235,200 L 230,255 L 240,255 Z" fill="#d9381e"/>
      <line x1="235" y1="200" x2="235" y2="260" stroke="#f5a823" stroke-width="1.2"/>
    </g>
  </g>
</svg>
