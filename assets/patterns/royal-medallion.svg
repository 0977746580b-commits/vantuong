<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <radialGradient id="medallionBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a81c22"/>
      <stop offset="70%" stop-color="#6c191e"/>
      <stop offset="100%" stop-color="#3e1812"/>
    </radialGradient>
    <linearGradient id="goldMedal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a823"/>
      <stop offset="50%" stop-color="#e06d28"/>
