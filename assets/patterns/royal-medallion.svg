  <circle cx="90" cy="90" r="76" fill="none" stroke="url(#goldMedal)" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="90" cy="90" r="68" fill="none" stroke="url(#goldMedal)" stroke-width="1.8"/>

  <!-- Vành hoa sen 12 cánh -->
  <g transform="translate(90, 90)" stroke="url(#goldMedal)" stroke-width="1.4" fill="rgba(245,168,35,0.15)">
    <path d="M0,-66 Q7,-54 0,-48 Q-7,-54 0,-66 Z"/>
    <path d="M33,-57 Q38,-44 24,-42 Q25,-52 33,-57 Z"/>
    <path d="M57,-33 Q55,-19 42,-24 Q48,-35 57,-33 Z"/>
    <path d="M66,0 Q54,7 48,0 Q54,-7 66,0 Z"/>
    <path d="M57,33 Q48,35 42,24 Q55,19 57,33 Z"/>
    <path d="M33,57 Q25,52 24,42 Q38,44 33,57 Z"/>
    <path d="M0,66 Q-7,54 0,48 Q7,54 0,66 Z"/>
    <path d="M-33,57 Q-38,44 -24,42 Q-25,52 -33,57 Z"/>
    <path d="M-57,33 Q-55,19 -42,24 Q-48,35 -57,33 Z"/>
    <path d="M-66,0 Q-54,-7 -48,0 Q-54,7 -66,0 Z"/>
    <path d="M-57,-33 Q-48,-35 -42,-24 Q-55,-19 -57,-33 Z"/>
    <path d="M-33,-57 Q-25,-52 -24,-42 Q-38,-44 -33,-57 Z"/>
