  <!-- Triện son lõi trung tâm -->
  <circle cx="90" cy="90" r="38" fill="#88301b" stroke="url(#goldMedal)" stroke-width="2"/>
  <text x="90" y="104" font-family="sans-serif" font-size="38" font-weight="900" fill="#f5a823" text-anchor="middle">象</text>
