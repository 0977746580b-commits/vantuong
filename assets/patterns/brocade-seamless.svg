<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a823" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#e06d28" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f5a823" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88301b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3e1812" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Mạng lưới kim tiền liên hoàn chìm -->
  <g stroke="url(#copperGrad)" stroke-width="1" fill="none">
    <circle cx="0" cy="0" r="60"/>
    <circle cx="160" cy="0" r="60"/>
    <circle cx="320" cy="0" r="60"/>
    <circle cx="80" cy="80" r="60"/>
    <circle cx="240" cy="80" r="60"/>
    <circle cx="0" cy="160" r="60"/>
    <circle cx="160" cy="160" r="60"/>
    <circle cx="320" cy="160" r="60"/>
    <circle cx="80" cy="240" r="60"/>
    <circle cx="240" cy="240" r="60"/>
    <circle cx="0" cy="320" r="60"/>
    <circle cx="160" cy="320" r="60"/>
    <circle cx="320" cy="320" r="60"/>
  </g>

  <!-- Hoa Sen Hoàng Gia Trung Tâm (160, 160) -->
  <g transform="translate(160, 160)" stroke="url(#goldGrad)" stroke-width="1.5" fill="none">
    <circle cx="0" cy="0" r="28" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="36"/>
    <!-- Cánh hoa sen 8 hướng -->
    <path d="M0,-24 Q8,-12 0,0 Q-8,-12 0,-24 Z" fill="rgba(245,168,35,0.12)"/>
    <path d="M0,24 Q8,12 0,0 Q-8,12 0,24 Z" fill="rgba(245,168,35,0.12)"/>
    <path d="M-24,0 Q-12,8 0,0 Q-12,-8 -24,0 Z" fill="rgba(245,168,35,0.12)"/>
    <path d="M24,0 Q12,8 0,0 Q12,-8 24,0 Z" fill="rgba(245,168,35,0.12)"/>
    <path d="M-17,-17 Q-4,-12 0,0 Q-12,-4 -17,-17 Z" fill="rgba(245,168,35,0.08)"/>
    <path d="M17,-17 Q4,-12 0,0 Q12,-4 17,-17 Z" fill="rgba(245,168,35,0.08)"/>
    <path d="M-17,17 Q-4,12 0,0 Q-12,4 -17,17 Z" fill="rgba(245,168,35,0.08)"/>
    <path d="M17,17 Q4,12 0,0 Q12,4 17,17 Z" fill="rgba(245,168,35,0.08)"/>
  </g>

  <!-- 4 Nửa hoa sen ở 4 cạnh và 4 góc để lặp seamless -->
  <g transform="translate(0, 0)" stroke="url(#goldGrad)" stroke-width="1.5" fill="none">
    <circle cx="0" cy="0" r="36"/>
    <path d="M0,24 Q8,12 0,0 Q-8,12 0,24 Z" fill="rgba(245,168,35,0.12)"/>
    <path d="M24,0 Q12,8 0,0 Q12,-8 24,0 Z" fill="rgba(245,168,35,0.12)"/>
    <path d="M17,17 Q4,12 0,0 Q12,4 17,17 Z" fill="rgba(245,168,35,0.08)"/>
  </g>
  <g transform="translate(320, 0)" stroke="url(#goldGrad)" stroke-width="1.5" fill="none">
    <circle cx="0" cy="0" r="36"/>
    <path d="M0,24 Q8,12 0,0 Q-8,12 0,24 Z" fill="rgba(245,168,35,0.12)"/>
    <path d="M-24,0 Q-12,8 0,0 Q-12,-8 -24,0 Z" fill="rgba(245,168,35,0.12)"/>
    <path d="M-17,17 Q-4,12 0,0 Q-12,4 -17,17 Z" fill="rgba(245,168,35,0.08)"/>
  </g>
  <g transform="translate(0, 320)" stroke="url(#goldGrad)" stroke-width="1.5" fill="none">
    <circle cx="0" cy="0" r="36"/>
    <path d="M0,-24 Q8,-12 0,0 Q-8,-12 0,-24 Z" fill="rgba(245,168,35,0.12)"/>
    <path d="M24,0 Q12,8 0,0 Q12,-8 24,0 Z" fill="rgba(245,168,35,0.12)"/>
    <path d="M17,-17 Q4,-12 0,0 Q12,-4 17,-17 Z" fill="rgba(245,168,35,0.08)"/>
  </g>
  <g transform="translate(320, 320)" stroke="url(#goldGrad)" stroke-width="1.5" fill="none">
    <circle cx="0" cy="0" r="36"/>
    <path d="M0,-24 Q8,-12 0,0 Q-8,-12 0,-24 Z" fill="rgba(245,168,35,0.12)"/>
    <path d="M-24,0 Q-12,8 0,0 Q-12,-8 -24,0 Z" fill="rgba(245,168,35,0.12)"/>
    <path d="M-17,-17 Q-4,-12 0,0 Q-12,-4 -17,-17 Z" fill="rgba(245,168,35,0.08)"/>
  </g>

  <!-- Mây cát tường uốn lượn ở (80, 80), (240, 80), (80, 240), (240, 240) -->
  <g transform="translate(80, 80)" stroke="url(#goldGrad)" stroke-width="1.2" fill="none">
    <path d="M-18,6 Q-24,-4 -12,-6 Q-6,-16 6,-10 Q18,-14 20,-2 Q26,6 16,10 Q6,14 -4,8 Q-12,12 -18,6 Z" fill="rgba(245,168,35,0.06)"/>
    <path d="M-10,0 Q0,-6 10,0"/>
  </g>
  <g transform="translate(240, 80)" stroke="url(#goldGrad)" stroke-width="1.2" fill="none">
    <path d="M-18,6 Q-24,-4 -12,-6 Q-6,-16 6,-10 Q18,-14 20,-2 Q26,6 16,10 Q6,14 -4,8 Q-12,12 -18,6 Z" fill="rgba(245,168,35,0.06)"/>
    <path d="M-10,0 Q0,-6 10,0"/>
  </g>
  <g transform="translate(80, 240)" stroke="url(#goldGrad)" stroke-width="1.2" fill="none">
    <path d="M-18,6 Q-24,-4 -12,-6 Q-6,-16 6,-10 Q18,-14 20,-2 Q26,6 16,10 Q6,14 -4,8 Q-12,12 -18,6 Z" fill="rgba(245,168,35,0.06)"/>
    <path d="M-10,0 Q0,-6 10,0"/>
  </g>
  <g transform="translate(240, 240)" stroke="url(#goldGrad)" stroke-width="1.2" fill="none">
    <path d="M-18,6 Q-24,-4 -12,-6 Q-6,-16 6,-10 Q18,-14 20,-2 Q26,6 16,10 Q6,14 -4,8 Q-12,12 -18,6 Z" fill="rgba(245,168,35,0.06)"/>
    <path d="M-10,0 Q0,-6 10,0"/>
  </g>
</svg>