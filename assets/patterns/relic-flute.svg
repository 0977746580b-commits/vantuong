<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <radialGradient id="fluteAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5a823" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d9381e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3e1812" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bambooBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a6e32"/>
      <stop offset="35%" stop-color="#e8bf72"/>
      <stop offset="70%" stop-color="#cf9f4d"/>
      <stop offset="100%" stop-color="#694318"/>
    </linearGradient>
    <linearGradient id="flutePedestal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2218"/>
      <stop offset="50%" stop-color="#3e1812"/>
      <stop offset="100%" stop-color="#1f0c08"/>
    </linearGradient>
    <filter id="fluteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hào quang ấm áp -->
  <circle cx="160" cy="180" r="130" fill="url(#fluteAura)"/>

  <!-- Bục đế trưng bày gỗ sơn mài (Pedestal base) -->
  <g id="pedestalFlute">
    <path d="M 60,370 L 260,370 L 280,395 L 40,395 Z" fill="url(#flutePedestal)" stroke="#e06d28" stroke-width="1.5"/>
    <path d="M 40,395 L 280,395 L 280,405 L 40,405 Z" fill="#1f0c08" stroke="#88301b" stroke-width="1"/>
    <!-- Giá đỡ sừng hươu chạm lộng (Carved wooden display cradle) -->
    <rect x="135" y="325" width="50" height="45" fill="url(#flutePedestal)" stroke="#f5a823" stroke-width="1.2"/>
    <!-- 2 chạc đỡ hình vầng trăng khuyết nâng thân tiêu nằm nghiêng tao nhã -->
    <path d="M 110,270 Q 115,310 140,325 L 130,325 Q 105,310 100,270 Z" fill="#88301b" stroke="#f5a823" stroke-width="1"/>
    <path d="M 210,220 Q 205,280 180,325 L 190,325 Q 215,280 220,220 Z" fill="#88301b" stroke="#f5a823" stroke-width="1"/>
  </g>

  <!-- THÂN TIÊU TRÚC ĐẶT NGHIÊNG 30 ĐỘ TRANG NHÃ -->
  <g id="bambooFlute" transform="rotate(-32 160 210)" filter="url(#fluteGlow)">
    <!-- Bóng thân tiêu -->
    <rect x="148" y="55" width="26" height="310" rx="12" fill="#1f0c08" opacity="0.5"/>

    <!-- Ống trúc già lên nước bóng màu hổ phách -->
    <rect x="147" y="50" width="26" height="310" rx="12" fill="url(#bambooBody)" stroke="#3e1812" stroke-width="2"/>

    <!-- Miệng thổi (Vết khuyết chữ V đầu ngọn) -->
    <path d="M 152,50 Q 160,60 168,50 Z" fill="#3e1812"/>

    <!-- Các đốt trúc già bọc đai chỉ ngũ sắc & nẹp đồng vàng -->
    <!-- Đốt 1 -->
    <rect x="145" y="90" width="30" height="6" rx="2" fill="#88301b" stroke="#f5a823" stroke-width="1"/>
    <!-- Đốt 2 -->
    <rect x="145" y="145" width="30" height="6" rx="2" fill="#88301b" stroke="#f5a823" stroke-width="1"/>
    <!-- Đốt 3 -->
    <rect x="145" y="200" width="30" height="6" rx="2" fill="#88301b" stroke="#f5a823" stroke-width="1"/>
    <!-- Đốt 4 -->
    <rect x="145" y="260" width="30" height="6" rx="2" fill="#88301b" stroke="#f5a823" stroke-width="1"/>
    <!-- Đốt đuôi -->
    <rect x="145" y="325" width="30" height="8" rx="2" fill="#3e1812" stroke="#f5a823" stroke-width="1.5"/>

    <!-- Các lỗ bấm âm (6 lỗ bấm truyền thống) -->
    <circle cx="160" cy="118" r="4.5" fill="#1f0c08" stroke="#3e1812" stroke-width="1"/>
    <circle cx="160" cy="170" r="4.5" fill="#1f0c08" stroke="#3e1812" stroke-width="1"/>
    <circle cx="160" cy="225" r="4.5" fill="#1f0c08" stroke="#3e1812" stroke-width="1"/>
    <circle cx="160" cy="245" r="4.5" fill="#1f0c08" stroke="#3e1812" stroke-width="1"/>
    <circle cx="160" cy="285" r="4.5" fill="#1f0c08" stroke="#3e1812" stroke-width="1"/>
    <circle cx="160" cy="305" r="4.5" fill="#1f0c08" stroke="#3e1812" stroke-width="1"/>

    <!-- Chữ triện cổ khắc dát vàng trên thân trúc -->
    <rect x="156" y="70" width="8" height="14" fill="#a81c22" stroke="#f5a823" stroke-width="0.8"/>
    <text x="160" y="81" font-size="9" fill="#f5a823" text-anchor="middle" font-family="serif">Trúc</text>

    <!-- Vòng ngọc bích và dây kết chỉ ngũ sắc buông đuôi -->
    <circle cx="160" cy="358" r="9" fill="#2c5a45" stroke="#f5a823" stroke-width="2"/>
    <circle cx="160" cy="358" r="4" fill="#ffffff" opacity="0.3"/>
    <!-- Dải tua rua đỏ thắm (DMC 321 & DMC 741) -->
    <path d="M 155,368 L 140,430 L 180,430 L 165,368 Z" fill="#a81c22"/>
    <line x1="160" y1="368" x2="160" y2="440" stroke="#f5a823" stroke-width="2"/>
  </g>
</svg>
