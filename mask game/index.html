<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HỌA DIỆN (The Dual Mask) — 2D Pixel Detective & Hát Bội Restoration Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #100c16;
      --panel-bg: #1a1424;
      --border-gold: #9a742b;
      --accent-gold: #ecc554;
      --text-main: #f5ecc9;
      --text-muted: #aba291;
      --jade: #58d68d;
      --crimson: #d9463e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 2px solid var(--border-gold);
      border-radius: 6px;
      padding: 8px 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.75);
      flex-wrap: wrap;
      gap: 8px;
    }

    .title-area h1 {
      font-size: 18px;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-area p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      background: #2b2135;
      color: var(--text-main);
      border: 1px solid var(--border-gold);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s;
    }

    button:hover {
      background: var(--border-gold);
      color: #111;
    }

    button.highlight {
      background: #5c1e1e;
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .workspace {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 960px;
    }

    .viewport-card {
      background: #000;
      border: 3px solid var(--border-gold);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    #gameCanvas {
      width: 100%;
      aspect-ratio: 480 / 250;
      image-rendering: auto;
      display: block;
      cursor: pointer;
    }

    .controls-bar {
      background: var(--panel-bg);
      border-top: 1px solid #382c44;
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 11.5px;
      justify-content: space-between;
      align-items: center;
    }

    .key-badge {
      display: inline-block;
      background: #332940;
      border: 1px solid #6b5324;
      color: var(--accent-gold);
      padding: 1px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-weight: bold;
      margin-right: 4px;
    }

    /* =========================================
       TẦNG 2: THƯ KHỐ & PHÒNG TỐI PUZZLE STYLES
       ========================================= */
    .f2-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 14, 0.82);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      animation: f2FadeIn 0.2s ease-out;
    }

    .darkroom-safe-overlay {
      background: radial-gradient(circle at center, rgba(80, 10, 15, 0.92) 0%, rgba(20, 5, 8, 0.96) 100%);
    }

    @keyframes f2FadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .f2-modal {
      background: #1c1424;
      border: 2px solid var(--border-gold);
      border-radius: 8px;
      width: 100%;
      max-width: 620px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--text-main);
    }

    .f2-header {
      background: #251b30;
      border-bottom: 1px solid var(--border-gold);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .f2-header h3 {
      font-size: 14px;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
      margin: 0;
    }

    .f2-btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
    }

    .f2-btn-close:hover {
      color: #fff;
    }

    .f2-footer {
      background: #251b30;
      border-top: 1px solid #3d2f4d;
      padding: 10px 16px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .f2-btn-primary {
      background: #873600;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .f2-btn-primary:hover {
      background: #a04000;
      color: #fff;
    }

    .f2-btn-secondary {
      background: #2b2135;
      border: 1px solid #6b5324;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12.5px;
    }

    .f2-btn-danger {
      background: #5c1e1e;
      border: 1px solid #e74c3c;
      color: #f5b7b1;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12.5px;
    }

    .f2-btn-danger:hover {
      background: #782828;
    }

    /* Modal Sắc Phong */
    .f2-edict-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #140e1a;
    }

    .f2-scroll-frame {
      background: #f4e8c1;
      color: #3e2723;
      border: 6px double #8d6e63;
      border-radius: 4px;
      padding: 18px 24px;
      position: relative;
      box-shadow: inset 0 0 20px rgba(100, 70, 40, 0.4);
    }

    .f2-seal-mark {
      position: absolute;
      top: 10px;
      left: 14px;
      font-size: 32px;
      color: rgba(183, 28, 28, 0.45);
      font-family: serif;
      font-weight: bold;
    }

    .f2-scroll-title {
      text-align: center;
      color: #b71c1c;
      font-size: 16px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .f2-verse {
      font-size: 13px;
      line-height: 1.6;
      text-align: justify;
    }

    .f2-seals-bottom {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
    }

    .f2-red-seal {
      background: #b71c1c;
      color: #fff;
      padding: 3px 8px;
      border-radius: 2px;
      font-family: serif;
      letter-spacing: 1px;
    }

    .f2-clue-box {
      background: #241c2e;
      border-left: 4px solid var(--accent-gold);
      padding: 10px 14px;
      border-radius: 0 4px 4px 0;
      display: flex;
      gap: 10px;
      font-size: 12px;
      line-height: 1.5;
    }

    /* Modal Hòm Sắt Pháp */
    .f2-chest-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: #141118;
    }

    .f2-chest-lid {
      text-align: center;
      border: 1px solid #4a3c30;
      background: #241d1a;
      padding: 12px 20px;
      border-radius: 6px;
      width: 100%;
    }

    .f2-french-inscription {
      font-family: serif;
      font-size: 18px;
      color: #ecc554;
      font-style: italic;
      letter-spacing: 1px;
    }

    .f2-lid-subtext {
      font-size: 11px;
      color: #aba291;
      margin-top: 4px;
    }

    .f2-lock-container {
      background: #3a2e26;
      border: 4px solid #6b5324;
      border-radius: 8px;
      padding: 16px 24px;
      box-shadow: inset 0 0 16px #000;
    }

    .f2-dials-row {
      display: flex;
      gap: 16px;
    }

    .f2-dial-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .f2-dial-btn {
      background: #5c4738;
      color: var(--accent-gold);
      border: 1px solid #8d6e63;
      width: 38px;
      height: 26px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
    }

    .f2-dial-btn:hover {
      background: var(--border-gold);
      color: #111;
    }

    .f2-dial-display {
      background: #1a1512;
      color: #fff;
      border: 2px solid #a88434;
      width: 44px;
      height: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      font-family: monospace;
      font-weight: bold;
      border-radius: 4px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    }

    .f2-chest-status {
      font-size: 12.5px;
      text-align: center;
      min-height: 22px;
    }

    /* Modal Loot */
    .f2-loot-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .f2-loot-item {
      display: flex;
      gap: 14px;
      background: #251b30;
      border: 1px solid var(--border-gold);
      border-radius: 6px;
      padding: 12px;
      align-items: center;
    }

    .f2-item-icon {
      font-size: 32px;
    }

    .f2-item-info h4 {
      color: var(--accent-gold);
      font-size: 14px;
      margin-bottom: 4px;
    }

    .f2-item-info p {
      font-size: 12px;
      color: var(--text-main);
      line-height: 1.5;
    }

    /* Modal Hóa chất */
    .f2-chem-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .f2-bottles-rack {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .f2-bottle-card {
      background: #251b30;
      border: 1px solid var(--border-gold);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .f2-bottle-art {
      width: 44px;
      height: 70px;
      border-radius: 4px 4px 10px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      border: 2px solid rgba(255,255,255,0.2);
    }

    .bottle-a { background: linear-gradient(to bottom, rgba(200, 220, 230, 0.4), rgba(150, 190, 210, 0.7)); }
    .bottle-b { background: linear-gradient(to bottom, rgba(240, 220, 130, 0.5), rgba(200, 160, 60, 0.8)); }
    .bottle-c { background: linear-gradient(to bottom, rgba(220, 220, 220, 0.3), rgba(180, 180, 180, 0.6)); }

    .f2-bottle-tag {
      font-size: 10px;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 2px 4px;
      border-radius: 2px;
    }

    .f2-bottle-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .f2-btn-sense {
      background: #332442;
      border: 1px solid #5a4270;
      color: var(--text-main);
      padding: 4px 6px;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
    }

    .f2-btn-sense:hover {
      background: #4a3460;
      color: #fff;
    }

    .f2-bottle-deduce {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      min-height: 18px;
    }

    .f2-chem-log {
      background: #140e1c;
      border: 1px solid #3d2f4d;
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.5;
      min-height: 48px;
    }

    /* Modal Phòng tối & Khay tráng phim */
    .f2-darkroom-modal {
      border-color: #d9463e;
      max-width: 680px;
      background: #200d12;
    }

    .f2-darkroom-lamp {
      background: #4a0f16;
      border-bottom: 2px solid #b71c1c;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: #ff9999;
    }

    .f2-darkroom-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .f2-pour-section {
      background: #2a1017;
      border: 1px solid #731e28;
      border-radius: 6px;
      padding: 10px 14px;
    }

    .f2-section-desc {
      font-size: 12px;
      color: #ffcccc;
      margin-bottom: 8px;
    }

    .f2-bottles-picker {
      display: flex;
      gap: 10px;
    }

    .f2-btn-bottle {
      background: #42161f;
      border: 1px solid #a33240;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11.5px;
    }

    .f2-btn-bottle.active {
      background: #b71c1c;
      border-color: #ff9999;
      box-shadow: 0 0 10px rgba(255, 100, 100, 0.6);
    }

    .f2-trays-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .f2-tray-box {
      background: #fdfefe;
      border: 4px solid #a6acaf;
      border-radius: 6px;
      height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.6);
      transition: all 0.15s;
    }

    .f2-tray-box:hover {
      border-color: #e74c3c;
      transform: translateY(-2px);
    }

    .f2-tray-label {
      font-size: 10px;
      font-weight: bold;
      color: #333;
      text-align: center;
    }

    .f2-tray-liquid {
      background: rgba(220, 220, 220, 0.4);
      color: #777;
      border-radius: 4px;
      height: 55px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
    }

    .f2-tray-liquid.filled {
      background: rgba(183, 28, 28, 0.35);
      border: 1px dashed #b71c1c;
    }

    .f2-tongs-bench {
      background: #17070b;
      border: 1px solid #5c1822;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .f2-film-preview {
      width: 140px;
      height: 90px;
      border: 2px solid #8d6e63;
      border-radius: 4px;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px;
    }

    .f2-film-glass {
      width: 100%;
      height: 100%;
      background: rgba(40, 35, 38, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ccc;
      font-size: 10.5px;
      text-align: center;
      padding: 4px;
      transition: background-color 0.5s ease;
    }

    .f2-clock-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .f2-clock-time {
      font-size: 28px;
      font-family: monospace;
      font-weight: bold;
      color: #ffcccc;
      text-shadow: 0 0 10px #ff0000;
    }

    .f2-clock-note {
      font-size: 10.5px;
      color: #ff9999;
      font-style: italic;
    }

    .f2-clock-pendulum {
      width: 8px;
      height: 24px;
      background: #ecc554;
      border-radius: 4px;
      transform-origin: top center;
      transition: transform 0.4s ease-in-out;
    }

    .f2-clock-pendulum.tick {
      transform: rotate(20deg);
    }

    .f2-actions-bar {
      background: #2a1017;
      border: 1px solid #731e28;
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .f2-msg-banner {
      font-size: 12px;
      line-height: 1.5;
      color: #ffe6e6;
    }

    .f2-btn-group {
      display: flex;
      gap: 8px;
    }

    /* Modal Historical Photo */
    .f2-photo-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .f2-vintage-photo-frame {
      border: 8px solid #3e2723;
      box-shadow: 0 8px 24px rgba(0,0,0,0.85);
      background: #111;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #canvasHistoricalPhoto {
      display: block;
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    .f2-photo-caption {
      margin-top: 6px;
      font-size: 11px;
      color: #bcaaa4;
    }

    .f2-photo-analysis {
      background: #251b30;
      border: 1px solid var(--border-gold);
      border-radius: 6px;
      padding: 12px 16px;
      width: 100%;
    }

    .f2-photo-analysis h4 {
      color: var(--accent-gold);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .f2-photo-analysis p {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-main);
    }

    /* Modal Asset Frames & Real Artwork */
    .f2-real-img-frame {
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid var(--border-gold);
      background: #0d0a11;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.75);
      position: relative;
    }

    .f2-real-img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      display: block;
      image-rendering: auto;
    }

    /* Cross-Section Map Modal */
    .map-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 6, 12, 0.88);
      backdrop-filter: blur(5px);
      z-index: 1100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      animation: f2FadeIn 0.2s ease-out;
    }

    .map-modal {
      background: #181220;
      border: 2px solid var(--border-gold);
      border-radius: 8px;
      width: 100%;
      max-width: 820px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .map-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .map-view-frame {
      border: 2px solid #5a4220;
      border-radius: 6px;
      overflow: hidden;
      background: #08060a;
      box-shadow: inset 0 0 20px #000;
    }

    .map-img {
      width: 100%;
      max-height: 380px;
      object-fit: contain;
      display: block;
    }

    .map-legend {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      background: #241c2e;
      border: 1px solid var(--border-gold);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 11.5px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-badge {
      background: #471822;
      border: 1px solid #d9463e;
      color: #ecc554;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
    }
    /* Only embedding/layout safety; game coordinates and artwork stay unchanged. */
    .f2-modal { max-height: calc(100dvh - 32px); }
    .f2-modal > div:not(.f2-header):not(.f2-footer) { min-height: 0; overflow-y: auto; }
    .f2-header, .f2-footer { flex-shrink: 0; }
    #btnMute, #btnFullscreen { min-height: 32px; white-space: nowrap; }
    #btnFullscreen {
      background: #2b2135;
      color: #ecc554;
      border: 1px solid #d4af37;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }
    #btnFullscreen:hover {
      background: #471822;
      border-color: #f5a823;
      color: #fff;
    }
    body.is-fullscreen {
      padding: 0 !important;
      margin: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      background: #050308 !important;
      justify-content: center !important;
      align-items: center !important;
    }
    body.is-fullscreen header {
      display: none !important;
    }
    body.is-fullscreen .workspace {
      max-width: 100vw !important;
      width: 100vw !important;
      height: 100vh !important;
      justify-content: space-between !important;
    }
    body.is-fullscreen .viewport-card {
      max-width: 100vw !important;
      width: 100vw !important;
      height: 100vh !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      justify-content: space-between !important;
    }
    body.is-fullscreen #gameCanvas {
      flex: 1 1 auto !important;
      width: 100% !important;
      height: calc(100vh - 46px) !important;
      max-height: calc(100vh - 46px) !important;
      object-fit: contain !important;
    }
    @media (max-width: 600px) {
      body { padding: 8px; }
      .controls-bar { gap: 8px; }
    }
  </style>
</head>
